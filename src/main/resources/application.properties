spring.application.name=parking-system
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks
# that entities match the tables and fails fast on startup if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Existing databases (created before Flyway) are treated as already at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.admin.email=${ADMIN_EMAIL:}

# Reservation rules
app.reservation.min-duration-minutes=30
app.reservation.max-duration-hours=24
app.reservation.max-days-ahead=7
app.reservation.max-active-per-user=3
app.reservation.early-check-in-minutes=15
app.reservation.no-show-grace-minutes=15
app.reservation.walk-in-buffer-minutes=120
app.reservation.start-time-tolerance-minutes=5
app.reservation.expiry-interval-ms=60000
